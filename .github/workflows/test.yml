name: Go QA & Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Wöchentlicher Lauf: die Vulnerability-DB hinter govulncheck ändert sich,
  # ohne dass hier jemand committet. Fängt außerdem Brüche durch neue
  # Go-Releases früh ab, statt erst beim nächsten PR.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Ein veralteter Lauf pro Branch reicht — der zweite Push bricht den ersten ab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-and-test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    # Ohne dieses Limit greift der Default von 360 Minuten. Die Scraper-Tests
    # sprechen echte Hosts an; ein hängender Request soll keinen Runner blockieren.
    timeout-minutes: 15
    permissions:
      contents: read # Minimale Berechtigung für maximale Sicherheit

    steps:
      # 1. Repository auschecken
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 2. Go-Umgebung aufsetzen & Caching aktivieren
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Ab hier laufen alle QA-Schritte per continue-on-error immer vollständig
      # durch, damit ein früher Fehlschlag die späteren Checks nicht verdeckt.
      # Rot wird der Job am Ende über den Schritt "QA Gate & Report".

      # 3. Modul-Integrität und aufgeräumte go.mod/go.sum prüfen
      - name: Check Go Modules
        id: gomod
        continue-on-error: true
        run: |
          set -o pipefail
          failed=0

          if ! go mod verify 2>&1 | tee gomod-verify.log; then
            {
              echo "### ❌ go mod verify"
              echo
              echo '```'
              cat gomod-verify.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum > tidy.diff 2>&1; then
            echo "go.mod/go.sum sind nicht aufgeraeumt:"
            cat tidy.diff
            echo "::error file=go.mod::go mod tidy erzeugt Aenderungen - lokal ausfuehren und committen"
            {
              echo "### ❌ go mod tidy"
              echo
              echo "go.mod/go.sum sind nicht aufgeräumt. Lokal \`go mod tidy\` laufen lassen und committen."
              echo '```diff'
              cat tidy.diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          # go mod tidy hat die Dateien womöglich verändert - Ausgangsstand
          # wiederherstellen, damit die folgenden Schritte den committeten
          # Zustand pruefen und nicht den korrigierten.
          git checkout -- go.mod go.sum

          exit $failed

      # 4. Kompilierbarkeit des gesamten Moduls prüfen
      #    Tests allein bauen nur die Pakete, die auch Tests haben.
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          if go build ./... 2>&1 | tee build.log; then
            exit 0
          fi

          {
            echo "### ❌ go build"
            echo
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1

      # 5. Code-Formatierung prüfen (gofmt)
      - name: Check Formatting (gofmt)
        id: gofmt
        continue-on-error: true
        run: |
          if ! unformatted="$(find . -type f -name '*.go' -not -path './vendor/*' -exec gofmt -l {} +)"; then
            echo "::error::gofmt could not inspect Go files"
            exit 1
          fi
          if [ -z "$unformatted" ]; then
            exit 0
          fi

          echo "Folgende Dateien entsprechen nicht dem gofmt-Standard:"
          echo "$unformatted"

          while IFS= read -r file; do
            echo "::error file=${file}::Datei ist nicht gofmt-konform (Fix: gofmt -w ${file})"
          done <<< "$unformatted"

          {
            echo "### ❌ gofmt"
            echo
            echo "Folgende Dateien entsprechen nicht dem gofmt-Standard:"
            echo '```'
            echo "$unformatted"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1

      # 6. Statische Code-Analyse mit den Standard-Tools (go vet)
      - name: Run go vet
        id: vet
        continue-on-error: true
        run: |
          set -o pipefail
          if go vet ./... 2>&1 | tee vet.log; then
            exit 0
          fi

          {
            echo "### ❌ go vet"
            echo
            echo '```'
            cat vet.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1

      # 7. Professionelles Linting (golangci-lint)
      #    Linter-Auswahl steht in .golangci.yml, Findings erscheinen dank
      #    problem-matchers als Annotations am Code.
      - name: Run golangci-lint
        id: golangci
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          problem-matchers: true

      # 8. Sicherheitsprüfungen auf bekannte Lücken (govulncheck)
      #    Version muss zur Go-Version aus go.mod passen: ältere govulncheck-
      #    Releases ziehen ein golang.org/x/tools, das mit neuem Go nicht baut.
      - name: Run Security Scan (govulncheck)
        id: govulncheck
        continue-on-error: true
        run: |
          set -o pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          if "$(go env GOPATH)/bin/govulncheck" ./... 2>&1 | tee govulncheck.log; then
            exit 0
          fi

          {
            echo "### ❌ govulncheck"
            echo
            echo '```'
            cat govulncheck.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1

      # 9. Tests mit gotestsum ausführen
      #    Version ebenfalls an die Go-Version gekoppelt (siehe govulncheck).
      - name: Run Tests with Race Detector & Coverage
        id: tests
        continue-on-error: true
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          "$(go env GOPATH)/bin/gotestsum" --junitfile junit.xml -- -v -race -coverprofile=coverage.out ./...

      # 10. Testergebnisse als hübsche Summary anzeigen
      #     Nur wenn junit.xml wirklich existiert — sonst meldete dieser Schritt
      #     ein ENOENT und damit einen Fehler, den es gar nicht gab.
      - name: Publish Test Summary
        if: always() && hashFiles('junit.xml') != ''
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5
        with:
          paths: "junit.xml"

      # 10b. Fehlenden Testreport explizit dokumentieren
      - name: Note Missing Test Report
        if: always() && hashFiles('junit.xml') == ''
        run: |
          {
            echo "### ⚠️ Keine Testergebnisse"
            echo
            echo "Der Testlauf hat keine \`junit.xml\` erzeugt — der Testbefehl ist"
            echo 'vor dem ersten Test abgebrochen. Details im Log von'
            echo '"Run Tests with Race Detector & Coverage".'
          } >> "$GITHUB_STEP_SUMMARY"

      # 11. Testabdeckung im Pipeline-Log anzeigen
      - name: Display Test Coverage
        if: always() && hashFiles('coverage.out') != ''
        run: go tool cover -func=coverage.out

      # 12. Test-Coverage schön formatiert im Summary anzeigen
      - name: Add Coverage Summary
        if: always() && hashFiles('coverage.out') != ''
        run: |
          {
            echo "### 📊 Code Coverage Report"
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 13. Rohdaten als Artefakt sichern, damit ein roter Lauf lokal
      #     analysierbar ist statt nur durchs Log scrollbar.
      - name: Upload Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            junit.xml
            coverage.out
          if-no-files-found: ignore
          retention-days: 14

      # 14. Gesamtergebnis dokumentieren und Job entsprechend rot/grün setzen
      - name: QA Gate & Report
        if: always()
        env:
          GOMOD: ${{ steps.gomod.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GOFMT: ${{ steps.gofmt.outcome }}
          VET: ${{ steps.vet.outcome }}
          LINT: ${{ steps.golangci.outcome }}
          VULN: ${{ steps.govulncheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          label() {
            case "$1" in
              success) echo "✅ ok" ;;
              failure) echo "❌ fehlgeschlagen" ;;
              skipped) echo "⏭️ übersprungen" ;;
              *)       echo "❔ $1" ;;
            esac
          }

          {
            echo "### 🧾 QA-Übersicht"
            echo
            echo "| Check | Ergebnis |"
            echo "| --- | --- |"
            echo "| go mod verify / tidy | $(label "$GOMOD") |"
            echo "| go build | $(label "$BUILD") |"
            echo "| gofmt | $(label "$GOFMT") |"
            echo "| go vet | $(label "$VET") |"
            echo "| golangci-lint | $(label "$LINT") |"
            echo "| govulncheck | $(label "$VULN") |"
            echo "| Tests | $(label "$TESTS") |"
            echo
            echo "Einzelne Findings stehen als Annotations am Code sowie in den"
            echo "Logs der jeweiligen Schritte. Rohdaten unter Artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

          failed=""
          for check in GOMOD BUILD GOFMT VET LINT VULN TESTS; do
            if [ "${!check}" = "failure" ]; then
              failed="${failed} ${check}"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::QA fehlgeschlagen:${failed}"
            exit 1
          fi

          echo "Alle QA-Checks bestanden."
