services:
  db:
    image: postgres:18.4-alpine@sha256:b6a26b9672dcce87fdcc185b902650129c90a6c4
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    ports:
     - 127.0.0.1:5432:5432
    environment:
      POSTGRES_PASSWORD: price-alert
      POSTGRES_USER: price-alert
      POSTGRES_DB: price-alert