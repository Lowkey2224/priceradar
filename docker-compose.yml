# Shared by db and db-test. The image stays literal in both services so
# Dependabot can find and bump it - it parses the raw text and would skip a
# YAML alias.
x-postgres: &postgres
  # set shared memory limit when using docker compose
  shm_size: 128mb
  # or set shared memory limit when deploy via swarm stack
  #volumes:
  #  - type: tmpfs
  #    target: /dev/shm
  #    tmpfs:
  #      size: 134217728 # 128*2^20 bytes = 128Mb
  environment:
    POSTGRES_PASSWORD: price-alert
    POSTGRES_USER: price-alert
    POSTGRES_DB: price-alert
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U price-alert -d price-alert"]
    interval: 2s
    timeout: 3s
    retries: 20
    start_period: 5s

services:
  db:
    <<: *postgres
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    ports:
     - 127.0.0.1:5432:5432

  # Separate database for `make test` - the tests TRUNCATE their tables.
  # tmpfs, so the data disappears with the container.
  db-test:
    <<: *postgres
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    profiles: [tools]
    ports:
     - 127.0.0.1:5433:5432
    tmpfs:
      - /var/lib/postgresql

  # Go toolchain including golangci-lint, govulncheck and gotestsum.
  # Not started by `docker compose up` - driven through the Makefile.
  go:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: [tools]
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/gocache
    environment:
      DATABASE_URL: "postgres://price-alert:price-alert@db:5432/price-alert?sslmode=disable"
      TEST_DB_URL: "postgres://price-alert:price-alert@db-test:5432/price-alert?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy

volumes:
  go-mod-cache:
  go-build-cache:
